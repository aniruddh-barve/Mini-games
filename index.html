<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paper Toss - Office</title>
    <style>
        body { margin: 0; padding: 0; background: #0f172a; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; user-select: none; touch-action: none; color: #fff; }
        #game-container { width: 95vw; max-width: 420px; background: #1e293b; border: 6px solid #334155; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; position: relative; }
        #ui-layer { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.85); color: #fff; padding: 14px 20px; font-size: 1rem; font-weight: 900; z-index: 5; border-bottom: 2px solid #334155; backdrop-filter: blur(4px); }
        .stat-box { display: flex; align-items: center; gap: 6px; }
        canvas { background: transparent; display: block; width: 100%; height: auto; }
        #overlay { position: absolute; top: 50px; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 10; }
        h2 { color: #f59e0b; margin-bottom: 12px; font-size: 1.8rem; letter-spacing: 1px; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 30px; white-space: pre-line; }
        .btn { background: #10b981; color: white; border: none; padding: 14px 36px; font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #059669; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <div class="stat-box">🔥 Streak: <span id="streak-display">0</span></div>
            <div class="stat-box">🏆 Best: <span id="best-display">0</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="780"></canvas>

        <div id="overlay">
            <h2 id="title-text">Paper toss - Office</h2>
            <p id="body-text">Progression Rules:
            • Office setting evolves every 3 basket streak.
            • Dustbin shifts locations every 2 throws.
            • Cross a 20-streak to make the bin move continuously!</p>
            <button class="btn" id="action-btn" onclick="startGame()">START RUN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let score = 0, highscore = 0, streakCount = 0, gameRunning = false;
        let totalThrowsCount = 0; 
        let particles = [], floaters = [], ballHistory = []; 
        
        const bin = { x: 155, y: 220, width: 90, height: 95, speedX: 2, direction: 1 };
        const ballDefault = { x: 200, y: 640, radius: 30, size: 30 };
        let ball = { ...ballDefault, vx: 0, vy: 0, isThrown: false, scale: 1, bounces: 0, rotation: 0, rotSpeed: 0, jagPoints: [] };
        
        const hypeWords = ["SWISH!", "PROMOTED!", "CLEAN TOSS!", "WILD SHOT!", "EXECUTIVE!", "JACKPOT!", "UNSTOPPABLE!"];
        
        const environments = [
            {
                name: "Open Cubicles",
                wallTop: '#334155', wallBottom: '#1e293b', floorTop: '#94a3b8', floorBottom: '#475569',
                ballTint: '#fdfdfd', binColors: ['#475569', '#64748b', '#334155'],
                drawExtra: (ctx) => {
                    ctx.fillStyle = '#475569'; ctx.fillRect(40, 80, 12, 200); ctx.fillRect(348, 80, 12, 200);
                    ctx.fillStyle = '#64748b'; ctx.fillRect(0, 160, 40, 8); ctx.fillRect(360, 160, 40, 8);
                }
            },
            {
                name: "Executive Cabin",
                wallTop: '#451a03', wallBottom: '#1c1917', floorTop: '#78350f', floorBottom: '#451a03',
                ballTint: '#ffedd5', binColors: ['#7c2d12', '#9a3412', '#431407'],
                drawExtra: (ctx) => {
                    ctx.fillStyle = '#020617'; ctx.fillRect(60, 30, 280, 120);
                    ctx.fillStyle = '#f59e0b'; ctx.fillRect(90, 90, 8, 14); ctx.fillRect(140, 70, 12, 25); ctx.fillRect(220, 85, 10, 30); ctx.fillRect(280, 100, 6, 12);
                    ctx.strokeStyle = '#78350f'; ctx.lineWidth = 6; ctx.strokeRect(60, 30, 280, 120);
                    ctx.beginPath(); ctx.moveTo(200, 30); ctx.lineTo(200, 150); ctx.stroke();
                }
            },
            {
                name: "ATM Vault Space",
                wallTop: '#090d16', wallBottom: '#020617', floorTop: '#1e293b', floorBottom: '#0f172a',
                ballTint: '#e0f2fe', binColors: ['#0284c7', '#0ea5e9', '#0369a1'],
                drawExtra: (ctx) => {
                    let glow = ctx.createLinearGradient(0,0,0,280); glow.addColorStop(0, '#06b6d4'); glow.addColorStop(1, 'transparent');
                    ctx.fillStyle = glow; ctx.fillRect(20, 20, 24, 240); ctx.fillRect(356, 20, 24, 240);
                    ctx.fillStyle = '#00f5ff'; ctx.fillRect(20, 110, 24, 3); ctx.fillRect(356, 110, 24, 3);
                }
            },
            {
                name: "Breakroom Lounge",
                wallTop: '#f0fdf4', wallBottom: '#dcfce7', floorTop: '#bbf7d0', floorBottom: '#86efac',
                ballTint: '#ffffff', binColors: ['#15803d', '#16a34a', '#14532d'],
                drawExtra: (ctx) => {
                    ctx.fillStyle = '#166534'; ctx.beginPath(); ctx.arc(0, 280, 45, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#14532d'; ctx.beginPath(); ctx.arc(-10, 260, 30, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(20, 290, 25, 0, Math.PI*2); ctx.fill();
                }
            }
        ];
        
        let currentEnvIndex = 0;

        function generatePaperShape() {
            const points = []; const numPoints = 14;
            for (let i = 0; i < numPoints; i++) points.push(0.85 + Math.random() * 0.18);
            return points;
        }

        let startTouchPos = { x: 0, y: 0 }; // Track anchor point
        let lastTouchPos = { x: 0, y: 0, time: 0 };
        let currentTouchPos = { x: 0, y: 0, time: 0 };
        let isDragging = false;

        canvas.addEventListener('pointerdown', (e) => {
            if (!gameRunning || ball.isThrown) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = ((e.clientX - rect.left) / rect.width) * canvas.width;
            const clickY = ((e.clientY - rect.top) / rect.height) * canvas.height;
            if (Math.hypot(clickX - ball.x, clickY - ball.y) < ball.radius * 3.0) {
                isDragging = true;
                startTouchPos = { x: clickX, y: clickY };
                currentTouchPos = { x: clickX, y: clickY, time: performance.now() };
                lastTouchPos = { ...currentTouchPos };
                ball.x = clickX; ball.y = clickY;
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            lastTouchPos = { ...currentTouchPos };
            currentTouchPos.x = ((e.clientX - rect.left) / rect.width) * canvas.width;
            currentTouchPos.y = ((e.clientY - rect.top) / rect.height) * canvas.height;
            currentTouchPos.time = performance.now();
            ball.x = currentTouchPos.x; ball.y = currentTouchPos.y;
        });

        canvas.addEventListener('pointerup', () => {
            if (!isDragging) return;
            isDragging = false;
            
            // Check absolute delta path length from start point
            let totalDeltaX = Math.abs(currentTouchPos.x - startTouchPos.x);
            let totalDeltaY = Math.abs(currentTouchPos.y - startTouchPos.y);
            
            // Reset position immediately if distance is too small (e.g. accidental drag or static lift)
            if (totalDeltaX < 30 && totalDeltaY < 30) {
                resetBall();
                return;
            }

            let duration = currentTouchPos.time - lastTouchPos.time;
            if (duration <= 0) duration = 16; 
            
            let instantaneousVx = (currentTouchPos.x - lastTouchPos.x) / duration;
            let instantaneousVy = (currentTouchPos.y - lastTouchPos.y) / duration;
            
            ball.vx = Math.max(-15, Math.min(15, instantaneousVx * 28));
            ball.vy = Math.max(-40, Math.min(-16, instantaneousVy * 34));
            
            let binCenterX = bin.x + (bin.width / 2);
            let deviationFromCenter = ball.x - binCenterX;
            ball.vx -= (deviationFromCenter * 0.015); 
            
            if (ball.vy < -12) { 
                ball.isThrown = true; 
                ball.bounces = 0; 
                ballHistory = []; 
                ball.rotSpeed = (Math.random() - 0.5) * 0.08; 
                totalThrowsCount++;
            } else { 
                resetBall(); 
            }
        });

        function relocateDustbinRandomly() {
            const minX = 40;
            const maxX = canvas.width - bin.width - 40;
            bin.x = Math.floor(minX + Math.random() * (maxX - minX));
        }

        function syncEnvironmentState() {
            currentEnvIndex = Math.floor(streakCount / 3) % environments.length;
        }

        function startGame() { 
            document.getElementById('overlay').style.display = 'none'; 
            score = 0; 
            streakCount = 0; 
            totalThrowsCount = 0;
            bin.x = 155; 
            syncEnvironmentState();
            particles = []; floaters = []; ballHistory = []; 
            document.getElementById('streak-display').innerText = streakCount; 
            resetBall(); 
            gameRunning = true; 
        }
        
        function resetBall() { 
            ball.x = ballDefault.x; 
            ball.y = ballDefault.y; 
            ball.vx = 0; ball.vy = 0; ball.scale = 1; 
            ball.radius = ballDefault.size; 
            ball.isThrown = false; ball.bounces = 0; 
            ball.rotation = Math.random() * Math.PI;
            ball.rotSpeed = 0;
            ball.jagPoints = generatePaperShape();
            ballHistory = []; 

            if (gameRunning && streakCount < 20 && totalThrowsCount % 2 === 0) {
                relocateDustbinRandomly();
                triggerRewardText(canvas.width / 2, bin.y + 130, "BIN SHIFTED!", "#f59e0b");
            }
        }

        function spawnCelebrationParticles(x, y) { 
            const colors = ['#34d399', '#60a5fa', '#fbbf24', '#f472b6', '#a855f7']; 
            for (let i = 0; i < 22; i++) { 
                particles.push({ 
                    x: x, y: y, 
                    vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.8) * 8, 
                    radius: Math.random() * 4 + 2, color: colors[Math.floor(Math.random() * colors.length)], 
                    alpha: 1, decay: 0.018 
                }); 
            } 
        }
        
        function triggerRewardText(x, y, txt, color = '#3b82f6') { 
            floaters.push({ x: x, y: y, text: txt, color: color, size: '24px', alpha: 1, vy: -1.4 }); 
        }

        function drawPaperBall(ctx, x, y, radius, rotation, jagPoints, env) {
            ctx.save(); ctx.translate(x, y); ctx.rotate(rotation);
            ctx.fillStyle = env.ballTint; ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1.5;
            ctx.beginPath();
            let numPoints = jagPoints.length;
            for (let i = 0; i < numPoints; i++) {
                let angle = (i / numPoints) * Math.PI * 2;
                let r = radius * jagPoints[i];
                let currX = Math.cos(angle) * r; let currY = Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(currX, currY); else ctx.lineTo(currX, currY);
            }
            ctx.closePath(); ctx.fill(); ctx.stroke();
            
            ctx.strokeStyle = 'rgba(100, 116, 139, 0.4)'; ctx.lineWidth = 1; ctx.beginPath();
            for (let i = 0; i < numPoints; i += 2) {
                let angleA = (i / numPoints) * Math.PI * 2; let angleB = ((i + 5) % numPoints / numPoints) * Math.PI * 2;
                ctx.moveTo(Math.cos(angleA) * radius * 0.2, Math.sin(angleA) * radius * 0.2);
                ctx.lineTo(Math.cos(angleB) * radius * jagPoints[i] * 0.75, Math.sin(angleB) * radius * jagPoints[i] * 0.75);
            }
            ctx.stroke(); ctx.restore();
        }

        function updateEngineLoop() {
            if (gameRunning) {
                ctx.save(); ctx.clearRect(0, 0, canvas.width, canvas.height);
                let activeEnv = environments[currentEnvIndex];

                let wallGrad = ctx.createLinearGradient(0, 0, 0, 280); 
                wallGrad.addColorStop(0, activeEnv.wallTop); wallGrad.addColorStop(1, activeEnv.wallBottom); 
                ctx.fillStyle = wallGrad; ctx.fillRect(0, 0, canvas.width, 280);
                
                let floorGrad = ctx.createLinearGradient(0, 280, 0, canvas.height); 
                floorGrad.addColorStop(0, activeEnv.floorTop); floorGrad.addColorStop(1, activeEnv.floorBottom); 
                ctx.fillStyle = floorGrad; ctx.fillRect(0, 280, canvas.width, canvas.height - 280);
                
                ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(0, 276, canvas.width, 5);
                activeEnv.drawExtra(ctx);

                if (streakCount >= 20) {
                    bin.x += bin.speedX * bin.direction;
                    const minBoundary = 25;
                    const maxBoundary = canvas.width - bin.width - 25;
                    if (bin.x <= minBoundary) { bin.x = minBoundary; bin.direction = 1; }
                    if (bin.x >= maxBoundary) { bin.x = maxBoundary; bin.direction = -1; }
                }

                ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; ctx.beginPath(); ctx.ellipse(bin.x + (bin.width/2), bin.y, bin.width/2, 10, 0, 0, Math.PI * 2); ctx.fill();
                
                if (ball.isThrown) {
                    ballHistory.push({ x: ball.x, y: ball.y, radius: ball.radius, rotation: ball.rotation, jagPoints: ball.jagPoints }); 
                    if (ballHistory.length > 5) ballHistory.shift();

                    ball.x += ball.vx; ball.y += ball.vy; ball.vy += 0.35; ball.rotation += ball.rotSpeed;

                    if (ball.y < 560 && ball.scale > 0.45) { 
                        ball.scale -= 0.016; ball.radius = ballDefault.size * ball.scale; 
                    }

                    if (ball.vy >= -2 && ball.y >= bin.y - 15 && ball.y <= bin.y + 40 && ball.scale < 0.65) {
                        let binCenterX = bin.x + (bin.width / 2);
                        let easyAllowance = (bin.width / 2) + 20; 
                        
                        if (Math.abs(ball.x - binCenterX) < easyAllowance && ball.bounces === 0) {
                            streakCount++; 
                            document.getElementById('streak-display').innerText = streakCount; 
                            spawnCelebrationParticles(ball.x, bin.y + 15);
                            
                            let word = hypeWords[(streakCount - 1) % hypeWords.length]; 
                            if (streakCount === 20) word = "BOSS MODE ACTIVE!";
                            triggerRewardText(binCenterX, bin.y - 50, word, '#10b981'); 
                            
                            syncEnvironmentState();
                            resetBall();
                        }
                    }

                    let dynamicFloor = canvas.height - (190 * (1 - ball.scale)); 
                    if (ball.y >= dynamicFloor && ball.vy > 0) {
                        ball.bounces++;
                        if (ball.bounces > 2 || Math.abs(ball.vx) < 0.2) { endGame(); } 
                        else {
                            ball.y = dynamicFloor; ball.vy = -ball.vy * 0.20; ball.vx *= 0.70; ball.radius *= 0.95;
                        }
                    }
                    if (ball.x < -40 || ball.x > canvas.width + 40) { endGame(); }
                }

                let binGrad = ctx.createLinearGradient(bin.x, bin.y, bin.x + bin.width, bin.y); 
                binGrad.addColorStop(0, activeEnv.binColors[0]); binGrad.addColorStop(0.5, activeEnv.binColors[1]); binGrad.addColorStop(1, activeEnv.binColors[2]); 
                ctx.fillStyle = binGrad; ctx.beginPath(); 
                ctx.moveTo(bin.x, bin.y); ctx.lineTo(bin.x + 8, bin.y + bin.height); ctx.lineTo(bin.x + bin.width - 8, bin.y + bin.height); ctx.lineTo(bin.x + bin.width, bin.y); 
                ctx.closePath(); ctx.fill();

                if (ball.isThrown && ballHistory.length > 1) {
                    for (let i = 0; i < ballHistory.length; i++) {
                        let h = ballHistory[i]; ctx.save(); ctx.globalAlpha = (i / ballHistory.length) * 0.20;
                        drawPaperBall(ctx, h.x, h.y, h.radius, h.rotation, h.jagPoints, activeEnv); ctx.restore();
                    }
                }

                if (!isDragging && !ball.isThrown) {
                    let idle = Math.sin(performance.now() * 0.0035) * 2;
                    drawPaperBall(ctx, ball.x, ball.y + idle, ball.radius, ball.rotation, ball.jagPoints, activeEnv);
                } else {
                    drawPaperBall(ctx, ball.x, ball.y, ball.radius, ball.rotation, ball.jagPoints, activeEnv);
                }

                for (let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.alpha -= p.decay; if (p.alpha <= 0) { particles.splice(i, 1); continue; } ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
                for (let i = floaters.length - 1; i >= 0; i--) { let f = floaters[i]; f.y += f.vy; f.alpha -= 0.015; if (f.alpha <= 0) { floaters.splice(i, 1); continue; } ctx.save(); ctx.globalAlpha = f.alpha; ctx.fillStyle = f.color; f.font = `900 ${f.size} 'Segoe UI', sans-serif`; f.textAlign = 'center'; ctx.fillText(f.text, f.x, f.y); ctx.restore(); }
                ctx.restore();
            }
            requestAnimationFrame(updateEngineLoop);
        }

        function endGame() { 
            gameRunning = false; 
            if (streakCount > highscore) { highscore = streakCount; document.getElementById('best-display').innerText = highscore; } 
            document.getElementById('overlay').style.display = 'flex'; 
            document.getElementById('title-text').innerText = "Paper toss - Office"; 
            document.getElementById('body-text').innerText = `Total Score: ${streakCount}\nTotal Office Throws: ${totalThrowsCount}\n\n${streakCount >= 20 ? 'You held your ground in moving Boss Mode!' : 'Tip: Watch out for the 2-throw random target shifts!'}`; 
            document.getElementById('action-btn').innerText = "TRY ANOTHER RUN"; 
        }
        requestAnimationFrame(updateEngineLoop);
    </script>
</body>
</html>
